[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "vaultkeep"
version = "0.3.0.dev2"
description = "Independent archive backups for Debian systems"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pathspec>=0.12.1,<1",
    "psutil>=6.1,<8",
    "pydantic>=2.10,<3",
    "ruamel.yaml>=0.18.16,<0.19",
]

[project.urls]
Homepage = "https://github.com/dutu/vaultkeep"
Repository = "https://github.com/dutu/vaultkeep"
Issues = "https://github.com/dutu/vaultkeep/issues"

[project.scripts]
vaultkeep = "vaultkeep.cli:main"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples/bisq-trigger.yaml",
    "/examples/electrum-trigger.yaml",
    "/examples/vaultkeep-schedule.yaml",
    "/examples/wasabi-trigger.yaml",
    "/systemd",
    "/install.sh",
    "/LICENSE",
    "/README.md",
    "/RELEASE.md",
    "/requirements.lock",
    "/requirements.in",
    "/scripts",
    "/docs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vaultkeep"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

# Keep the existing Trigger style exceptions during integration.
[tool.ruff.lint.per-file-ignores]
"src/vaultkeep/trigger/childproc.py" = ["SIM105"]
"src/vaultkeep/trigger/matcher.py" = ["SIM110"]
"src/vaultkeep/trigger/models.py" = ["UP042"]
"src/vaultkeep/trigger/systemd.py" = ["UP042"]
"src/vaultkeep/trigger/monitor.py" = ["B023"]
"src/vaultkeep/trigger/state.py" = ["SIM105"]
"tests/trigger/test_monitor.py" = ["RUF059"]
"tests/trigger/test_preflight.py" = ["SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["vaultkeep"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

# Keep strict checks on core and Trigger integration; exempt imported legacy internals.
[[tool.mypy.overrides]]
module = [
    "vaultkeep.trigger.childproc",
    "vaultkeep.trigger.detection",
    "vaultkeep.trigger.models",
    "vaultkeep.trigger.monitor",
    "vaultkeep.trigger.process",
    "vaultkeep.trigger.state",
    "vaultkeep.trigger.systemd",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=vaultkeep",
    "--cov-branch",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
markers = [
    "release_gate: tests that require an explicit release-validation environment",
]

[tool.coverage.run]
branch = true
source = ["vaultkeep"]

[tool.coverage.report]
show_missing = true
skip_covered = true
