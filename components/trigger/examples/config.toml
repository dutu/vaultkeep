# Example VaultKeep Trigger configuration.
#
# All instances are disabled. Enable one only after its process identity, data
# directory, related writer processes, and VaultKeep job scope have been verified on
# the installed versions (see docs/trigger/process-detection.md in the repository).

[trigger]
poll_seconds = 2
confirm_seconds = 5
log_level = "INFO"
# Absolute path to the VaultKeep executable. The installer places it at
# /usr/local/bin/vaultkeep; do not assume it is present.
vaultkeep = "/usr/local/bin/vaultkeep"
# Optional advisory deadline. Omit for no deadline.
# deadline_seconds = 3600

[trigger.notifications]
enabled = false
command = "notify-send"
timeout_ms = 5000

[[instance]]
id = "electrum-main"
app = "electrum"
enabled = false
data_dir = "~/.electrum"

[instance.matcher]
# An application entrypoint is required; exe_realpath may add another check.
entrypoint = { kind = "script", value = "/home/user/.local/opt/electrum/current/run_electrum" }
argv_tokens = ["--dir", "/home/user/.electrum"]

[instance.job]
config = "/home/user/.config/vaultkeep/jobs/electrum-main.yaml"

[[instance]]
id = "bisq-main"
app = "bisq"
enabled = false
data_dir = "~/.local/share/Bisq"

[instance.matcher]
# Bisq directory identity is not resolvable from argv alone in v1; keep disabled
# until a verified identity is established.
entrypoint = { kind = "java_main", value = "bisq.desktop.app.BisqAppMain" }

[instance.job]
config = "/home/user/.config/vaultkeep/jobs/bisq-main.yaml"

[[instance]]
id = "wasabi-main"
app = "wasabi"
enabled = false
data_dir = "~/.walletwasabi/client"

[instance.matcher]
entrypoint = { kind = "script", value = "/opt/wasabi/WalletWasabi" }

[instance.job]
config = "/home/user/.config/vaultkeep/jobs/wasabi-main.yaml"
params = { NETWORK = "mainnet" }
