[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "vaultkeep-trigger"
version = "0.2.0"
description = "Monitor wallet instances and trigger VaultKeep backups after confirmed shutdown"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "psutil>=6.1,<8",
]

[project.urls]
Homepage = "https://github.com/dutu/vaultkeep"
Repository = "https://github.com/dutu/vaultkeep"
Issues = "https://github.com/dutu/vaultkeep/issues"

[project.scripts]
vaultkeep-trigger = "vaultkeep_trigger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultkeep_trigger"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/systemd",
    "/examples",
    "/LICENSE",
    "/README.md",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

# Preserve imported runtime semantics; these existing style findings are unrelated
# to packaging. _guard_instance executes its callbacks synchronously.
[tool.ruff.lint.per-file-ignores]
"src/vaultkeep_trigger/childproc.py" = ["SIM105"]
"src/vaultkeep_trigger/matcher.py" = ["SIM110"]
"src/vaultkeep_trigger/models.py" = ["UP042"]
"src/vaultkeep_trigger/systemd.py" = ["UP042"]
"src/vaultkeep_trigger/monitor.py" = ["B023"]
"src/vaultkeep_trigger/state.py" = ["SIM105"]
"tests/test_monitor.py" = ["RUF059"]
"tests/test_preflight.py" = ["SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["vaultkeep_trigger"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = [".", "src"]
testpaths = ["tests"]
