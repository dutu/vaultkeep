## Wasabi backup example (user mode)
## Copy to ~/.config/vaultkeep/jobs/wasabi-main.yaml and replace example paths.
## Run Vaultkeep as the Wasabi user: vaultkeep --user (no sudo).
## Verify the Wasabi process and data directory before enabling the trigger.
## Setup guide: docs/trigger/apps/wasabi.md

config_version: 2                        # Configuration schema
job:
  id: wasabi-main                        # Unique job ID

## Backup mode
# backup_mode: combined                  # combined (default) | per_file
## per_file requires one source directory and follow_symlinks: false.

## Sources
sources:
  - path: /home/user/.walletwasabi/client # Directory to back up
    archive_path_mode: prefix            # Store under archive_prefix
    archive_prefix: wasabi               # Path prefix in the archive
    # exclude:                            # Source-specific exclusions
    #   - "*.tmp"

# exclude:                                # Global exclusions
#   - "*.swp"

source_options:
  follow_symlinks: false                 # Follow symbolic links
  cross_filesystems: false               # Cross filesystem boundaries
  ignore_missing: false                  # Allow missing sources

## Destination
destination:
  root: /mnt/backups/wasabi-main         # Backup directory
  name_template: "backup-{job}-{timestamp_utc:%Y%m%dT%H%M%SZ}"
  # marker_file: ".vaultkeep-target"      # Verify file under root
  # expected_fstype: ext4                # Required filesystem type

## Archive
archive:
  format: tar.zst                        # Archive format
  compression_level: 6                  # Compression strength

## Encryption
encryption:
  mode: none                             # Encryption disabled
  # password_file: /home/user/.config/vaultkeep/secrets/wasabi-main.passphrase
## password_file requires mode: password and archive.format: tar.7z.

## Retention
retention:
  hourly: 24                             # Keep up to 24 hourly backups
  daily: 7                               # Keep up to 7 daily backups
  weekly: 8                              # Keep up to 8 weekly backups
  monthly: 12                            # Keep up to 12 monthly backups
  yearly: 3                              # Keep up to 3 yearly backups

## Schedule (mutually exclusive with an enabled trigger)
schedule:
  enabled: false                         # Scheduled backups off
  # interval: daily                      # hourly | daily | weekly | monthly
  ## Hourly schedules require hour 00; use e.g. window: "00:10-00:50".
  # window: "01:00-05:00"                # Local time range; alternative to at
  # at: "03:30"                          # Local time; alternative to window
  # day: sunday                          # Weekly: monday through sunday
  # day: 1                               # Monthly: day 1–28
  # persistent: true                     # Run once after missed activation

## Shutdown trigger
consistency:
  mode: application_offline              # Require stopped observations during source processing

application:
  name: wasabi                            # Data-directory detection rules
  data_dir: /home/user/.walletwasabi/client # Must match Wasabi data directory
  matcher:
    entrypoints:                         # Accepted process entrypoints
      - kind: script
        value: /opt/wasabi/WalletWasabi
    argv_tokens: []                      # Required command-line arguments
    # exe_realpath: /opt/wasabi/WalletWasabi # Executable path predicate
    # cmdline_regex: 'WalletWasabi'      # Optional regex (max 200 chars)
    # env_eq: {}                         # Only WASABI_DATADIR is supported

trigger:
  enabled: false                         # Shutdown-triggered backups off
  poll_seconds: 2                        # Process check interval
  confirm_seconds: 5                     # Shutdown confirmation delay
  # deadline_seconds: 3600               # Advisory; never stops a backup
  # params: {}                            # Runtime strings (e.g. NETWORK)

## External executable for explicit vaultkeep notify calls (optional)
# external_notifier:
#   command: telegram-notify
#   timeout_seconds: 15

## Lifecycle hooks (optional; commands run via /bin/sh -c)
## Best-effort delivery through external_notifier (uncomment its settings above).
## Delivery timeout: 15s; failures are logged without failing the hook.
## See docs/configuration.md#external-notifications for setup and diagnostics.
# hooks:
#   before_check:
#     command: 'vaultkeep notify --level info "Checking backup sources for {job} on {hostname}"'
#     timeout_seconds: 60                # Allowed: 1–3600 (default 300)
#   before_archive:
#     command: 'vaultkeep notify --level info "Creating backup for {job} on {hostname}"'
#     timeout_seconds: 60
#   after_archive:
#     command: 'vaultkeep notify --level info "Finished reading backup sources for {job} on {hostname}"'
#     timeout_seconds: 60
#   on_success:
#     command: 'vaultkeep notify --level info "Backup completed for {job} on {hostname}"'
#     timeout_seconds: 60
#   on_failure:
#     command: 'vaultkeep notify --level error "Backup failed for {job} on {hostname}: $VAULTKEEP_ERROR"'
#     timeout_seconds: 60
#   on_unchanged:
#     command: 'vaultkeep notify --level info "Backup sources unchanged for {job} on {hostname}"'
#     timeout_seconds: 60

## Desktop notifications (independent for backup and trigger)
desktop_notifications:
  command: notify-send                   # Notification command
  timeout_ms: 5000                       # Timeout in milliseconds
  backup:
    enabled: false                       # Backup status alerts
  trigger:
    enabled: false                       # Trigger status alerts

## Logging
logging:
  level: info                            # Log verbosity
  include_command_output: false         # Include hook command output
